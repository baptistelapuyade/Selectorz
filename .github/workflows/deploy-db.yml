# Spielt neue Datenbank-Migrationen auf das echte Supabase-Projekt ein,
# sobald sie (nach grüner CI und Freigabe) auf main landen.
# Nur Migrationen; Auth- und Mail-Einstellungen bleiben im Dashboard.
name: Datenbank deployen

on:
  push:
    branches: [main]
    paths: ["supabase/migrations/**", ".github/workflows/deploy-db.yml"]
  workflow_dispatch:

concurrency:
  group: deploy-db
  cancel-in-progress: false

jobs:
  push:
    runs-on: ubuntu-latest
    environment: production
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      PROJECT_REF: xrajutdssaqdroydriiy
    steps:
      - uses: actions/checkout@v4
      # v3 installiert aus npm statt über die GitHub-API (kein Rate-Limit mehr); feste Version für gleiche Läufe
      - uses: supabase/setup-cli@v3
        with:
          version: 2.122.0
      - run: supabase link --project-ref "$PROJECT_REF"
      # CLI 2.x kennt --remote noch nicht (erst ab 3.x); --linked gilt in beiden
      - name: Ausstehende Migrationen anzeigen
        run: supabase migration list --linked
      - name: Migrationen einspielen
        run: supabase db push --linked --yes
